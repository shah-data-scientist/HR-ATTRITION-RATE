[project]
name = "hr-attrition-rate"
version = "0.1.0"
description = ""
authors = [
    {name = "Shahul SHAIK",email = "shah.data.scientist@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Shared by all services
    "pandas",
    "numpy (>=2.3.4,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "bcrypt (>=4.0.0,<5.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "requests (>=2.33.0)",
    # Explicit floor versions to address transitive CVEs
    "urllib3 (>=2.7.0)",
    "pillow (>=12.2.0)",
    "tornado (>=6.5.5)",
    "pygments (>=2.20.0)",
    "fonttools (>=4.60.2)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry.group.api.dependencies]
fastapi = ">=0.121.1,<0.122.0"
uvicorn = ">=0.38.0,<0.39.0"
pydantic = ">=2.12.4,<3.0.0"
scikit-learn = "*"
imbalanced-learn = "*"
shap = "*"
joblib = ">=1.5.2,<2.0.0"
sqlalchemy = ">=2.0.44,<3.0.0"
scipy = ">=1.16.3,<2.0.0"
seaborn = ">=0.13.2,<0.14.0"
matplotlib = "*"
openpyxl = "*"
psycopg2-binary = ">=2.9.11,<3.0.0"

[tool.poetry.group.ui.dependencies]
streamlit = ">=1.54.0"
plotly = "*"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0"
pytest-cov = ">=7.0.0,<8.0.0"
pytest-asyncio = ">=1.2.0,<2.0.0"
ruff = "^0.14.4"
mypy = "^1.18.2"
black = ">=26.3.1,<27.0"
selenium = "^4.38.0"
playwright = "^1.56.0"
pytest-playwright = "^0.7.2"
types-requests = "^2.32.4.20250913"
gitpython = ">=3.1.50"
protobuf = ">=6.33.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Exclude manual tests from automatic collection
norecursedirs = ["tests/manual", "tests/fixtures", "tests/archive", ".git", ".venv", "__pycache__"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "D", "UP", "ANN", "ASYNC", "B", "C4", "DTZ", "ERA", "FA",
    "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SIM", "TID", "ARG", "PERF", "PTH", "PL"
]
ignore = [
    "ANN", # All type annotation related
    "ARG", # All argument related
    "B",   # All bug-risk related
    "C",   # All complexity related
    "C408", # Unnecessary dict() call (explicitly ignore)
    "D",   # All docstring related
    "DTZ", # All datetime related
    "E",   # All error related
    "ERA", # All commented-out code related
    "F",   # All pyflakes related
    "I",   # All isort related
    "ICN", # All import convention related
    "N",   # All naming related
    "PERF",# All performance related
    "PL",  # All pylint related
    "PT",  # All pytest related
    "RET", # All return related
    "SIM", # All simplification related
    "UP",  # All pyupgrade related
    "PTH", # All pathlib related
    "W",   # All warning related
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"] # Ignore unused imports in __init__.py
"tests/test_streamlit_app.py" = ["ANN401", "RET503"] # Allow dynamically typed expressions in test mocks and ignore false positive RET503
"utils.py" = ["ANN401"] # Allow dynamically typed expressions in utility functions

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = false # Changed from true to false
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
exclude = ["venv/", ".venv/", "tests/", "htmlcov/", "__pycache__/", "models/", "data/", "Project Inputs/", "api/app/", "database/seed_data.py"]

[[tool.mypy.overrides]]
module = "database.models"
disable_error_code = ["var-annotated"]

[tool.coverage.run]
omit = [
    "tests/*",
    "api/tests/*",
    "**/__init__.py",
    "database/seed_data.py",
    "scripts/*"
]



