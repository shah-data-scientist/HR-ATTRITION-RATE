version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: hr_attrition_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  fastapi_app:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/hr_attrition_db
      API_HOST: 0.0.0.0
      API_PORT: 8001
    depends_on:
      - db

  streamlit_app:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://fastapi_app:8001
    depends_on:
      - fastapi_app

volumes:
  db_data: