version: '3.8'

# Production Docker Compose Configuration
# Use with: docker-compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hr_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db_init:
    build:
      context: .
      dockerfile: docker/Dockerfile.database
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DISABLE_DB: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    networks:
      - hr_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  fastapi_app:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_HOST: 0.0.0.0
      API_PORT: 8001
      DISABLE_DB: "false"
      API_KEY: ${API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      MPLCONFIGDIR: /tmp/matplotlib
    depends_on:
      db:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - hr_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  streamlit_app:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://fastapi_app:8001
      API_KEY: ${API_KEY}
    depends_on:
      fastapi_app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - hr_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: ["python", "-m", "scripts.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WORKER_POLL_SEC: ${WORKER_POLL_SEC:-2}
      WORKER_STALE_SEC: ${WORKER_STALE_SEC:-600}
      DISABLE_DB: "false"
      MPLCONFIGDIR: /tmp/matplotlib
    depends_on:
      db:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    restart: always
    networks:
      - hr_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  db_data:
    driver: local

networks:
  hr_network:
    driver: bridge
